services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../config:/app/config
    depends_on:
      - postgres
      - qdrant

  # Runs scheduled SharePoint syncs, isolated from the API process.
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    command: ["python", "-m", "app.workers.sync_scheduler"]
    volumes:
      - ../config:/app/config
    depends_on:
      - postgres
      - qdrant

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: aisearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6343:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
