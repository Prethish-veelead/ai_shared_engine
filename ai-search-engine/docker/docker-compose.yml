services:
  api:
    build:
      # Repo root, not ai-search-engine/ - the Dockerfile now also builds
      # admin-portal and bot-ui into this same image (single-origin deploy,
      # docs/SINGLE_ORIGIN_DEPLOY.md), so both need to be in the build context.
      context: ../..
      dockerfile: ai-search-engine/docker/Dockerfile
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../config:/app/config
    depends_on:
      - postgres
      - qdrant

  # Runs scheduled SharePoint syncs, isolated from the API process. Shares the
  # same image as api (built once, cached) even though it never serves the
  # static frontends it also contains - same pattern as before this change.
  worker:
    build:
      context: ../..
      dockerfile: ai-search-engine/docker/Dockerfile
    env_file: ../.env
    command: ["python", "-m", "app.workers.sync_scheduler"]
    volumes:
      - ../config:/app/config
    depends_on:
      - postgres
      - qdrant

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: aisearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6343:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
